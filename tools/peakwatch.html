function logApiError(context, error){
  console.error("[PeakWatch API]", context, error);
}

async function fetchJsonResilient(url){
  let res;
  try{
    res = await fetch(url);
  }catch(networkErr){
    logApiError("Direct fetch failed: " + url, networkErr);
    // fetch() itself threw — this is the actual CORS/network-failure case, worth a proxy retry
    try{
      const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const res2 = await fetch(proxied);
      if(!res2.ok) throw new Error("HTTP " + res2.status);
      return await res2.json();
    }catch(proxyErr){
      logApiError("Fallback proxy also failed: " + url, proxyErr);
      throw new Error(
        "Couldn't reach the provider directly (likely a network or CORS block: " + networkErr.message + "), " +
        "and the fallback proxy also failed (" + proxyErr.message + ")."
      );
    }
  }
  // We got a real response — CORS isn't the issue. Surface the API's own error, don't waste time on a proxy retry.
  if(!res.ok){
    const body = await res.text().catch(() => "");
    logApiError("Returned HTTP " + res.status + ": " + url, body);
    throw new Error("HTTP " + res.status + (body ? " — " + body.slice(0, 220) : ""));
  }
  return await res.json();
}

// One call gets everything we need: current price, today's change, and the 52-week high —
// Twelve Data's /quote response includes a fifty_two_week.high field directly, so there's no
// need to separately fetch and scan a historical series ourselves.
async function fetchQuoteWithHigh(symbol, apiKey){
  const url = "https://api.twelvedata.com/quote?symbol=" + encodeURIComponent(symbol) + "&apikey=" + encodeURIComponent(apiKey);
  let data;
  try{
    data = await fetchJsonResilient(url);
  }catch(e){
    logApiError("fetchQuoteWithHigh failed for " + symbol, e);
    if(/HTTP 401/.test(e.message) || /apikey/i.test(e.message)){
      throw new Error("This API key isn't valid for Twelve Data — note it needs to be a Twelve Data key (twelvedata.com/pricing), not a key from a different provider. Click \"Change API key\" above to re-enter it.");
    }
    throw e;
  }
  if(data && data.status === "error"){
    throw new Error(data.message || ("Twelve Data returned an error for " + symbol + "."));
  }
  if(!data || data.close === undefined){
    throw new Error("No quote returned for " + symbol + ".");
  }
  const price = parseFloat(data.close);
  const changePct = parseFloat(data.percent_change);
  const athValue = data.fifty_two_week ? parseFloat(data.fifty_two_week.high) : NaN;
  if(isNaN(price) || isNaN(athValue)){
    throw new Error("Couldn't parse price/52-week-high for " + symbol + " from the response.");
  }
  return { price, changePct: isNaN(changePct) ? 0 : changePct, athValue };
}

function IndexRow({ def, state }){
  if(state.loading){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status" }, "Loading…")
    );
  }
  if(state.error){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status error" }, state.error)
    );
  }
  if(!state.quote) return null;

  const { price, changePct, athValue } = state.quote;
  const isUp = changePct >= 0;
  const drawdownPct = ((price - athValue) / athValue) * 100;
  const atPeak = drawdownPct >= -0.05; // essentially at 52-week high
  const fillPct = Math.max(0, Math.min(100, (price / athValue) * 100));

  return h("tr", null,
    h("td", { className: "idx-name" },
      h("div", { className: "serif" }, def.label, " ", h("span", { className: "mono symtag" }, def.symbol)),
      h("div", { className: "idx-sub" }, def.sub)
    ),
    h("td", { className: "num" },
      h("div", { className: "mono price" }, price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
      h("div", { className: "mono change " + (isUp ? "up" : "down") }, (isUp ? "▲ " : "▼ ") + Math.abs(changePct).toFixed(2) + "%")
    ),
    h("td", { className: "num" },
      h("div", { className: "mono" }, athValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
    ),
    h("td", { className: "num" },
      h("div", { className: "mono drawdown " + (atPeak ? "at-peak" : "below-peak") },
        atPeak ? "At peak" : drawdownPct.toFixed(2) + "%"
      ),
      h("div", { className: "gauge" },
        h("div", { className: "gauge-fill", style: { width: fillPct + "%" } }),
        h("div", { className: "gauge-peak-marker" })
      )
    )
  );
}

/* ---------- Live research refresh via Gemini (BYOK, Google Search grounding) ----------
   Twelve Data's fundamentals endpoint costs more per call than the free tier's entire
   per-minute budget (confirmed earlier), SEC EDGAR explicitly disables CORS, and the finance
   sites only expose data via paid scraping — so genuinely live fundamentals aren't available
   for free. Instead, "Refresh Research" re-runs the same kind of research Claude did originally,
   but live, via Gemini's free tier with Google Search grounding, triggered on demand (not
   automatically) so you control when it spends API quota. */

const GEMINI_MODEL = "gemini-2.5-flash";

function buildResearchPrompt(companies, label){
  const tickerList = companies.map(c => `${c.company} (${c.symbol})`).join(", ");
  return `You are a financial research analyst. Using Google Search, find the latest publicly available data, as of today, for each of these ${label}: ${tickerList}.

For EACH company, find:
1. Trailing P/E ratio (a number, or a short string if not meaningful)
2. A brief 1-2 sentence note on how that P/E compares to the company's own historical average
3. PEG ratio (or "n/m" if not meaningful due to negative or shrinking earnings)
4. Price-to-book (P/B) ratio
5. ROIC (return on invested capital) — a percentage, or a brief qualitative note if unavailable
6. Most recent free cash flow figure or trend (brief)
7. Most recent earnings growth (YoY), or note if the company hasn't reported its latest quarter yet

Also write:
- One or two sentences summarizing the group's current overall market mood or theme, in a wry but factually accurate tone (not sensational, no investment advice)
- For each company, one concise sentence about the primary driver of its recent stock performance, same tone

Respond with ONLY valid JSON, no markdown fences, no commentary before or after, in exactly this shape:
{
  "asOf": "<today's date, e.g. August 5, 2026>",
  "overall": "...",
  "companies": {
    "${companies[0].symbol}": { "pe": "...", "peHistory": "...", "peg": "...", "pb": "...", "roic": "...", "fcf": "...", "earningsGrowth": "...", "outlookNote": "..." }
  }
}
Include an entry for every ticker listed above, keyed exactly by ticker symbol.`;
}

async function fetchGeminiResearch(apiKey, model, companies, label){
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
  const prompt = buildResearchPrompt(companies, label);
  let res;
  try{
    res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        tools: [{ google_search: {} }],
        generationConfig: { maxOutputTokens: 4000 }
      })
    });
  }catch(e){
    logApiError("Gemini network failure (" + label + ")", e);
    throw new Error("Couldn't reach the Gemini API (" + e.message + "). Check your internet connection and try again.");
  }
  if(!res.ok){
    const body = await res.text().catch(() => "");
    logApiError("Gemini returned HTTP " + res.status + " (" + label + ")", body);
    let msg = "HTTP " + res.status;
    try{
      const parsed = JSON.parse(body);
      if(parsed.error && parsed.error.message) msg += " — " + parsed.error.message;
    }catch(_e){ if(body) msg += " — " + body.slice(0, 200); }
    if(res.status === 400 || res.status === 403) msg += " (check that your Gemini API key is correct and active)";
    if(res.status === 429) msg += " (Gemini free-tier rate limit reached — wait a minute and try again)";
    throw new Error(msg);
  }
  const data = await res.json();
  const candidate = (data.candidates || [])[0];
  const text = candidate && candidate.content && Array.isArray(candidate.content.parts)
    ? candidate.content.parts.map(p => p.text || "").join("\n")
    : "";
  const clean = text.replace(/^```json\s*|^```\s*|```\s*$/gm, "").trim();
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    logApiError("Failed to parse Gemini research JSON (" + label + ")", { raw: text, error: e.message });
    throw new Error("Gemini's response wasn't valid JSON, so it couldn't be parsed. Try refreshing again — this occasionally happens with longer research responses.");
  }
  if(!parsed.companies){
    logApiError("Gemini research JSON missing companies object (" + label + ")", parsed);
    throw new Error("Gemini's response didn't include company data. Try refreshing again.");
  }
  return parsed;
}


function App(){
  const [apiKey, setApiKey] = useState("");
  const [keyInput, setKeyInput] = useState("");
  const [data, setData] = useState({}); // key -> { loading, error, quote }
  const [magData, setMagData] = useState({});
  const [semiData, setSemiData] = useState({});
  const [watchlistData, setWatchlistData] = useState({});
  const [lastRefreshed, setLastRefreshed] = useState(null);
  const [loadingAll, setLoadingAll] = useState(false);
  const [loadProgress, setLoadProgress] = useState(null); // { done, total }

  // Research data starts as the static, dated snapshot and can be replaced with a live
  // Gemini-researched refresh (see "Refresh Research" below) — never automatic, always on click.
  const [magResearch, setMagResearch] = useState({ asOf: FUNDAMENTALS.asOf, overall: DRAWDOWN_COMMENTARY.overall, fundamentals: FUNDAMENTALS.data, notes: DRAWDOWN_COMMENTARY.notes });
  const [semiResearch, setSemiResearch] = useState({ asOf: SEMI_FUNDAMENTALS.asOf, overall: SEMI_OUTLOOK.overall, fundamentals: SEMI_FUNDAMENTALS.data, notes: SEMI_OUTLOOK.notes });
  // No pre-researched static snapshot exists for this group — it starts empty and relies entirely
  // on "Refresh Research" (honest starting point rather than a fabricated snapshot).
  const [watchlistResearch, setWatchlistResearch] = useState(() => {
    const fundamentals = {}, notes = {};
    Object.keys(WATCHLIST_RESEARCH.data).forEach(symbol => {
      const entry = WATCHLIST_RESEARCH.data[symbol];
      fundamentals[symbol] = { pe: entry.pe, peHistory: entry.peHistory, peg: entry.peg, pb: entry.pb, roic: entry.roic, fcf: entry.fcf, earningsGrowth: entry.earningsGrowth };
      notes[symbol] = entry.outlookNote;
    });
    return { asOf: WATCHLIST_RESEARCH.asOf, overall: WATCHLIST_RESEARCH.overall, fundamentals, notes };
  });
  const [geminiKey, setGeminiKey] = useState("");
  const [geminiKeyInput, setGeminiKeyInput] = useState("");
  const [refreshingMag, setRefreshingMag] = useState(false);
  const [refreshingSemi, setRefreshingSemi] = useState(false);
  const [refreshingWatchlist, setRefreshingWatchlist] = useState(false);
  const [magRefreshError, setMagRefreshError] = useState(null);
  const [semiRefreshError, setSemiRefreshError] = useState(null);
  const [watchlistRefreshError, setWatchlistRefreshError] = useState(null);

  const handleSaveGeminiKey = () => {
    const trimmed = geminiKeyInput.trim();
    if(!trimmed) return;
    setGeminiKey(trimmed);
  };

  const refreshResearch = async (companies, label, setLoading, setErr, setResult) => {
    if(!geminiKey){ setErr("Connect a Gemini API key above first."); return; }
    setLoading(true); setErr(null);
    try{
      const result = await fetchGeminiResearch(geminiKey, GEMINI_MODEL, companies, label);
      const fundamentals = {}, notes = {};
      companies.forEach(c => {
        const entry = result.companies[c.symbol];
        if(entry){
          fundamentals[c.symbol] = { pe: entry.pe, peHistory: entry.peHistory, peg: entry.peg, pb: entry.pb, roic: entry.roic, fcf: entry.fcf, earningsGrowth: entry.earningsGrowth };
          notes[c.symbol] = entry.outlookNote;
        }
      });
      setResult({ asOf: result.asOf || new Date().toLocaleDateString(), overall: result.overall || "", fundamentals, notes });
    }catch(e){
      setErr(e.message);
    }finally{
      setLoading(false);
    }
  };

  const refreshMagResearch = () => refreshResearch(MAG7, "Magnificent 7 stocks", setRefreshingMag, setMagRefreshError, setMagResearch);
  const refreshSemiResearch = () => refreshResearch(SEMI, "US semiconductor stocks", setRefreshingSemi, setSemiRefreshError, setSemiResearch);
  const refreshWatchlistResearch = () => refreshResearch(WATCHLIST, "tech and supply-chain stocks (Oracle, Dell, SK hynix, ASML, KLA, Lumentum, Arm, and the South Korea market)", setRefreshingWatchlist, setWatchlistRefreshError, setWatchlistResearch);

  // Twelve Data's free tier allows only 8 credits/minute, and each quote call costs 1 credit.
  // Firing all symbols in parallel blows straight through that, so we load them one at a
  // time with a comfortable gap instead — slower, but it won't get rate-limited.
  const THROTTLE_MS = 8500;
  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  const loadAll = useCallback(async (key) => {
    setLoadingAll(true);
    const initial = {};
    SYMBOLS.forEach(s => { initial[s.key] = { loading: true, error: null, quote: null }; });
    setData(initial);
    const initialMag = {};
    MAG7.forEach(s => { initialMag[s.key] = { loading: true, error: null, quote: null }; });
    setMagData(initialMag);
    const initialSemi = {};
    SEMI.forEach(s => { initialSemi[s.key] = { loading: true, error: null, quote: null }; });
    setSemiData(initialSemi);
    const initialWatchlist = {};
    WATCHLIST.forEach(s => { initialWatchlist[s.key] = { loading: true, error: null, quote: null }; });
    setWatchlistData(initialWatchlist);

    const tasks = [
      ...SYMBOLS.map(s => ({ kind: "index", def: s })),
      ...MAG7.map(s => ({ kind: "mag", def: s })),
      ...SEMI.map(s => ({ kind: "semi", def: s })),
      ...WATCHLIST.map(s => ({ kind: "watchlist", def: s }))
    ];
    setLoadProgress({ done: 0, total: tasks.length });

    for(let i = 0; i < tasks.length; i++){
      const { kind, def } = tasks[i];
      const setForKind = kind === "index" ? setData : kind === "mag" ? setMagData : kind === "semi" ? setSemiData : setWatchlistData;
      try{
        const quote = await fetchQuoteWithHigh(def.symbol, key);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: null, quote } }));
      }catch(e){
        logApiError("loadAll: " + kind + " symbol " + def.symbol + " failed", e);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: e.message, quote: null } }));
      }
      setLoadProgress({ done: i + 1, total: tasks.length });
      if(i < tasks.length - 1) await delay(THROTTLE_MS);
    }

    setLastRefreshed(new Date());
    setLoadProgress(null);
    setLoadingAll(false);
  }, []);

  const handleSaveKey = () => {
    const trimmed = keyInput.trim();
    if(!trimmed) return;
    setApiKey(trimmed);
    loadAll(trimmed);
  };

  const handleChangeKey = () => {
    setApiKey("");
    setKeyInput("");
    setData({});
    setMagData({});
  };

  const anyLoaded = Object.values(data).some(d => d && d.quote);

  return h("div", null,
    !apiKey ? h("div", { className: "keybox" },
      h("h2", { className: "serif" }, "Connect a data source"),
      h("p", null, "PeakWatch runs entirely in your browser — it needs your own free Twelve Data API key to fetch live prices. Sign up takes about a minute, no credit card needed for the free tier."),
      h("div", { className: "keyrow" },
        h("input", {
          type: "text", placeholder: "Paste your API key here",
          value: keyInput, onChange: e => setKeyInput(e.target.value)
        }),
        h("button", { className: "btn btn-primary", onClick: handleSaveKey, disabled: !keyInput.trim() }, "Connect")
      ),
      h("p", { className: "note" },
        "Don't have a key? Get one free at ",
        h("a", { href: "https://twelvedata.com/pricing", target: "_blank", rel: "noopener" }, "twelvedata.com"),
        ". Your key is kept in this browser tab's memory only — it's never saved to disk or sent anywhere except directly to Twelve Data, and you'll need to re-enter it next time you open this page."
      )
    ) : h("div", null,
      anyLoaded ? h("div", { className: "ticker" },
        SYMBOLS.map(s => {
          const d = data[s.key];
          if(!d || !d.quote) return null;
          const changePct = d.quote.changePct;
          const up = changePct >= 0;
          return h("div", { className: "chip", key: s.key },
            h("span", { className: "sym" }, s.symbol),
            h("span", null, d.quote.price.toLocaleString(undefined, { maximumFractionDigits: 2 })),
            h("span", { className: up ? "up" : "down" }, (up ? "▲" : "▼") + Math.abs(changePct).toFixed(2) + "%")
          );
        })
      ) : null,

      h("div", { className: "toolbar" },
        h("button", {
          className: "btn btn-secondary",
          onClick: () => {
            loadAll(apiKey);
            // Tie research refresh to the main price refresh, but only if a Gemini key is already
            // connected — this keeps data fresh without ever spending API quota you haven't opted into.
            if(geminiKey){
              refreshMagResearch();
              refreshSemiResearch();
              refreshWatchlistResearch();
            }
          },
          disabled: loadingAll
        },
          loadingAll && loadProgress ? "Loading " + loadProgress.done + " of " + loadProgress.total + "…" : "↻ Refresh"
        ),
        h("button", { className: "btn-text", onClick: handleChangeKey }, "Change API key"),
        lastRefreshed ? h("span", { className: "updated" }, "Last updated ", lastRefreshed.toLocaleTimeString()) : null,
        loadingAll ? h("span", { className: "updated" }, "(throttled to stay under the free-tier rate limit — takes a few minutes for 25 symbols)") : null,
        geminiKey ? h("span", { className: "updated" }, "(Refresh also updates research, since Gemini is connected)") : null
