<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Free &amp; Cheap Parking Finder</title>
<meta name="description" content="Find free, cheap, and legal parking near any address or your current location." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  :root{
    --asphalt:#24262B;
    --asphalt-2:#1a1c20;
    --concrete:#EDEBE5;
    --concrete-2:#dfdcd3;
    --line-yellow:#F5C518;
    --meter-green:#3F7D5C;
    --paid-rust:#C1483B;
    --ink:#F7F5F0;
    --text-dark:#24262B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--concrete);
    color:var(--text-dark);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}

  /* header */
  .hero{
    background:linear-gradient(180deg,var(--asphalt) 0%,var(--asphalt-2) 100%);
    color:var(--ink);
    padding:28px clamp(16px,4vw,48px) 20px;
    position:relative;
  }
  .hazard{
    height:10px;
    background:repeating-linear-gradient(45deg,var(--line-yellow) 0 18px,var(--asphalt) 18px 36px);
  }
  .backlink{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--line-yellow);
    text-decoration:none;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:14px;
    opacity:0.9;
  }
  .backlink:hover{opacity:1;text-decoration:underline;}
  .hero h1{
    font-size:clamp(1.6rem,3.2vw,2.6rem);
    margin:0 0 6px;
    font-weight:700;
  }
  .hero p.sub{
    margin:0;
    max-width:60ch;
    color:#c9c7c2;
    font-size:clamp(0.9rem,1.1vw,1rem);
  }

  /* search bar */
  .searchwrap{
    max-width:1200px;margin:0 auto;
    padding:22px clamp(16px,4vw,48px) 0;
  }
  .searchcard{
    background:var(--ink);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    position:relative;
    top:-18px;
  }
  .searchcard input[type=text]{
    flex:1 1 240px;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--concrete-2);
    font-size:1rem;
    font-family:inherit;
    outline:none;
    background:#fff;
  }
  .searchcard input[type=text]:focus{border-color:var(--meter-green);}
  select{
    padding:12px 10px;
    border-radius:10px;
    border:2px solid var(--concrete-2);
    font-family:inherit;
    font-size:0.95rem;
    background:#fff;
  }
  button{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-size:0.95rem;
    transition:transform 0.08s ease, filter 0.15s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--line-yellow);color:var(--asphalt);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--concrete-2);color:var(--text-dark);}
  .btn-ghost:hover{filter:brightness(0.97);}

  .filters{
    max-width:1200px;margin:0 auto;
    padding:0 clamp(16px,4vw,48px);
    display:flex;gap:10px;flex-wrap:wrap;
    margin-top:-6px;margin-bottom:14px;
  }
  .chip{
    padding:8px 14px;border-radius:999px;
    font-size:0.82rem;font-weight:600;
    border:2px solid var(--concrete-2);
    background:#fff;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .chip.active{background:var(--asphalt);color:var(--ink);border-color:var(--asphalt);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.free{background:var(--meter-green);}
  .dot.paid{background:var(--paid-rust);}
  .dot.unknown{background:#9a9690;}

  /* layout */
  .layout{
    max-width:1200px;margin:0 auto;
    padding:0 clamp(16px,4vw,48px) 40px;
    display:grid;
    grid-template-columns:minmax(280px,380px) 1fr;
    gap:18px;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    #map{height:340px !important;order:-1;}
  }
  #map{
    height:560px;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    background:#ddd;
  }

  .results{
    display:flex;flex-direction:column;gap:12px;
    max-height:560px;overflow-y:auto;
    padding-right:4px;
  }
  @media (max-width:820px){ .results{max-height:none;} }

  .status{
    font-family:'Inter',sans-serif;
    padding:14px 16px;border-radius:10px;
    background:#fff;border:2px dashed var(--concrete-2);
    font-size:0.9rem;color:#555;
  }
  .status.error{border-color:var(--paid-rust);color:var(--paid-rust);background:#fdf1f0;}

  /* ticket card - signature element */
  .ticket{
    position:relative;
    background:#fff;
    border-radius:12px;
    padding:14px 16px 14px 18px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    border-left:6px solid var(--meter-green);
  }
  .ticket.paid{border-left-color:var(--paid-rust);}
  .ticket.unknown{border-left-color:#9a9690;}
  .ticket::after{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;width:0;
    border-right:2px dashed #d8d5cf;
  }
  .ticket-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .ticket-name{
    font-weight:600;font-size:0.98rem;line-height:1.3;
  }
  .badge{
    flex-shrink:0;
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-weight:700;font-size:0.72rem;
    border:2px solid var(--meter-green);
    color:var(--meter-green);
    line-height:1.05;
  }
  .badge.paid{border-color:var(--paid-rust);color:var(--paid-rust);}
  .badge.unknown{border-color:#9a9690;color:#8b8880;}
  .ticket-meta{
    display:flex;gap:14px;flex-wrap:wrap;
    margin-top:8px;
    font-size:0.8rem;color:#666;
  }
  .ticket-meta span.mono{color:var(--text-dark);}
  .ticket-note{
    margin-top:6px;font-size:0.8rem;color:#7a7a7a;
  }

  .disclaimer{
    max-width:1200px;margin:0 auto 30px;
    padding:0 clamp(16px,4vw,48px);
    font-size:0.78rem;color:#7a7a7a;
    line-height:1.5;
  }
  .disclaimer strong{color:var(--text-dark);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#cac7c0;border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

function toRad(v){ return v * Math.PI / 180; }
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatDistance(m){
  if(m < 1000) return Math.round(m) + " m";
  return (m/1000).toFixed(2) + " km";
}

function classifySpot(tags){
  const access = (tags.access || "").toLowerCase();
  if(access === "private" || access === "no") return null; // exclude non-public
  const fee = (tags.fee || "").toLowerCase();
  if(fee === "no" || fee === "false" || fee === "0") return "free";
  if(fee === "yes" || fee === "true" || fee === "1") return "paid";
  return "unknown"; // no fee tag present - likely free but unconfirmed
}

async function geocode(query){
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(query);
  const res = await fetch(url, { headers: { "Accept-Language": "en" } });
  if(!res.ok) throw new Error("Location lookup failed.");
  const data = await res.json();
  if(!data || !data.length) throw new Error("Couldn't find that location. Try a more specific address.");
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
}

async function reverseGeocodeLabel(lat, lon){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
    const res = await fetch(url, { headers: { "Accept-Language": "en" } });
    const data = await res.json();
    return data && data.display_name ? data.display_name : "Current location";
  }catch(e){ return "Current location"; }
}

function buildNameFromTags(tags){
  if(tags.name) return tags.name;
  if(tags["addr:housenumber"] && tags["addr:street"]) return `${tags["addr:housenumber"]} ${tags["addr:street"]}`;
  if(tags["addr:street"]) return `Parking on ${tags["addr:street"]}`;
  if(tags["addr:full"]) return tags["addr:full"];
  if(tags.operator) return `${tags.operator} Parking`;
  if(tags.brand) return `${tags.brand} Parking`;
  return null;
}

const nameCache = new Map();
function shortLabelFromAddress(addr, displayName){
  if(addr){
    const road = addr.road || addr.pedestrian || addr.footway;
    const house = addr.house_number;
    const suburb = addr.suburb || addr.neighbourhood || addr.quarter;
    if(road && house) return `${house} ${road}`;
    if(road) return `Parking on ${road}`;
    if(suburb) return `Parking near ${suburb}`;
  }
  if(displayName) return displayName.split(",").slice(0,2).join(",").trim();
  return null;
}
async function reverseGeocodeShort(lat, lon){
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1&zoom=18`;
  const res = await fetch(url, { headers: { "Accept-Language": "en" } });
  if(!res.ok) throw new Error("lookup failed");
  const data = await res.json();
  return shortLabelFromAddress(data.address, data.display_name);
}

async function fetchParking(lat, lon, radius){
  const q = `[out:json][timeout:25];(node["amenity"="parking"](around:${radius},${lat},${lon});way["amenity"="parking"](around:${radius},${lat},${lon});relation["amenity"="parking"](around:${radius},${lat},${lon}););out center tags;`;
  const res = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "data=" + encodeURIComponent(q)
  });
  if(!res.ok) throw new Error("Parking data service is busy. Try again in a moment.");
  const data = await res.json();
  const spots = [];
  for(const el of (data.elements || [])){
    const tags = el.tags || {};
    const cls = classifySpot(tags);
    if(cls === null) continue;
    const lat2 = el.lat != null ? el.lat : (el.center ? el.center.lat : null);
    const lon2 = el.lon != null ? el.lon : (el.center ? el.center.lon : null);
    if(lat2 == null || lon2 == null) continue;
    const dist = haversineMeters(lat, lon, lat2, lon2);
    const tagName = buildNameFromTags(tags);
    const hasName = !!tagName;
    spots.push({
      id: el.type + el.id,
      name: tagName || (tags.parking ? ("Parking (" + tags.parking.replace(/_/g," ") + ")") : "Unnamed parking area"),
      hasName: hasName,
      needsLookup: !tagName,
      lat: lat2, lon: lon2,
      status: cls,
      parkingType: tags.parking || null,
      maxstay: tags.maxstay || null,
      charge: tags.charge || tags["fee:amount"] || null,
      capacity: tags.capacity || null,
      distance: dist
    });
  }
  spots.sort((a,b) => a.distance - b.distance);
  return spots.slice(0, 60);
}

function Ticket({ spot }){
  const badgeText = spot.status === "free" ? "FREE" : spot.status === "paid" ? (spot.charge || "PAID") : "CHECK";
  return h("div", { className: "ticket " + spot.status },
    h("div", { className: "ticket-top" },
      h("div", { className: "ticket-name" }, spot.name),
      h("div", { className: "badge " + spot.status }, badgeText)
    ),
    h("div", { className: "ticket-meta" },
      h("span", null, "📍 ", h("span", { className: "mono" }, formatDistance(spot.distance))),
      (spot.parkingType && spot.hasName) ? h("span", null, spot.parkingType.replace(/_/g," ")) : null,
      spot.capacity ? h("span", null, "Capacity: ", h("span",{className:"mono"}, spot.capacity)) : null,
      spot.maxstay ? h("span", null, "Max stay: ", h("span",{className:"mono"}, spot.maxstay)) : null
    ),
    spot.status === "unknown" ? h("div", { className: "ticket-note" }, "No fee data on record — verify with posted signage.") : null
  );
}

function App(){
  const [query, setQuery] = useState("");
  const [radius, setRadius] = useState(1200);
  const [filter, setFilter] = useState("all");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [results, setResults] = useState([]);
  const [center, setCenter] = useState(null);
  const [centerLabel, setCenterLabel] = useState("");

  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersLayer = useRef(null);
  const centerMarker = useRef(null);
  const searchGen = useRef(0);

  const enrichUnnamed = useCallback(async (spots, gen) => {
    const targets = spots.filter(s => s.needsLookup).slice(0, 20);
    for(const spot of targets){
      if(searchGen.current !== gen) return;
      const key = spot.lat.toFixed(3) + "," + spot.lon.toFixed(3);
      let label = nameCache.get(key);
      if(!label){
        try{
          label = await reverseGeocodeShort(spot.lat, spot.lon);
          if(label) nameCache.set(key, label);
        }catch(e){ label = null; }
        await new Promise(r => setTimeout(r, 1100)); // stay within Nominatim's rate limit
      }
      if(searchGen.current !== gen) return;
      if(label){
        setResults(prev => prev.map(p => p.id === spot.id ? { ...p, name: label, hasName: true, needsLookup: false } : p));
      }
    }
  }, []);

  useEffect(() => {
    leafletMap.current = L.map(mapRef.current, { scrollWheelZoom: true }).setView([20,0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(leafletMap.current);
    markersLayer.current = L.layerGroup().addTo(leafletMap.current);
    return () => { leafletMap.current.remove(); };
  }, []);

  const runSearch = useCallback(async (lat, lon, label) => {
    setLoading(true); setError(null);
    searchGen.current += 1;
    const myGen = searchGen.current;
    try{
      setCenter({lat, lon});
      setCenterLabel(label);
      const spots = await fetchParking(lat, lon, radius);
      setResults(spots);
      const map = leafletMap.current;
      map.setView([lat, lon], 15);
      if(centerMarker.current) centerMarker.current.remove();
      centerMarker.current = L.circleMarker([lat, lon], { radius: 8, color:"#F5C518", fillColor:"#F5C518", fillOpacity:1, weight:2 })
        .addTo(map).bindPopup("Search location: " + label);
      if(spots.length === 0){
        setError("No mapped parking areas found nearby. Try a larger radius.");
      } else {
        enrichUnnamed(spots, myGen);
      }
    }catch(e){
      setError(e.message || "Something went wrong.");
      setResults([]);
    }finally{
      setLoading(false);
    }
  }, [radius, enrichUnnamed]);

  const handleSearch = async (e) => {
    e.preventDefault();
    if(!query.trim()) return;
    setLoading(true); setError(null);
    try{
      const loc = await geocode(query.trim());
      await runSearch(loc.lat, loc.lon, loc.label);
    }catch(e){
      setError(e.message);
      setLoading(false);
    }
  };

  const handleUseLocation = () => {
    if(!navigator.geolocation){
      setError("Geolocation isn't supported by this browser.");
      return;
    }
    setLoading(true); setError(null);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      const label = await reverseGeocodeLabel(latitude, longitude);
      setQuery(label);
      await runSearch(latitude, longitude, label);
    }, (err) => {
      setError("Couldn't get your location: " + err.message);
      setLoading(false);
    }, { enableHighAccuracy: true, timeout: 10000 });
  };

  useEffect(() => {
    if(!markersLayer.current) return;
    markersLayer.current.clearLayers();
    const toShow = filter === "all" ? results : results.filter(s => s.status === filter);
    toShow.forEach(s => {
      const color = s.status === "free" ? "#3F7D5C" : s.status === "paid" ? "#C1483B" : "#9a9690";
      L.circleMarker([s.lat, s.lon], { radius:7, color, fillColor:color, fillOpacity:0.85, weight:1 })
        .addTo(markersLayer.current)
        .bindPopup(`<strong>${s.name}</strong><br/>${s.status.toUpperCase()} · ${formatDistance(s.distance)}`);
    });
  }, [results, filter]);

  const filtered = results.filter(s => filter === "all" ? true : s.status === filter);

  return h("div", null,
    h("div", { className:"hero" },
      h("a", { className:"backlink", href:"../index.html" }, "← Utility Directory"),
      h("h1", { className:"display" }, "Free & Cheap Parking Finder"),
      h("p", { className:"sub" }, "Search any address, or use your current location, to find legal public parking nearby — sorted by distance, tagged free, paid, or unconfirmed.")
    ),
    h("div", { className:"hazard" }),

    h("div", { className:"searchwrap" },
      h("form", { className:"searchcard", onSubmit: handleSearch },
        h("input", {
          type:"text", placeholder:"Enter an address, city, or place…",
          value: query, onChange: e => setQuery(e.target.value)
        }),
        h("select", { value: radius, onChange: e => setRadius(Number(e.target.value)) },
          h("option", { value:600 }, "Within 600 m"),
          h("option", { value:1200 }, "Within 1.2 km"),
          h("option", { value:2500 }, "Within 2.5 km"),
          h("option", { value:5000 }, "Within 5 km")
        ),
        h("button", { type:"submit", className:"btn-primary" }, loading ? "Searching…" : "Search"),
        h("button", { type:"button", className:"btn-ghost", onClick: handleUseLocation }, "📍 Near me")
      )
    ),

    h("div", { className:"filters" },
      h("button", { className:"chip" + (filter==="all"?" active":""), onClick:()=>setFilter("all") }, "All"),
      h("button", { className:"chip" + (filter==="free"?" active":""), onClick:()=>setFilter("free") }, h("span",{className:"dot free"}), "Free"),
      h("button", { className:"chip" + (filter==="paid"?" active":""), onClick:()=>setFilter("paid") }, h("span",{className:"dot paid"}), "Paid"),
      h("button", { className:"chip" + (filter==="unknown"?" active":""), onClick:()=>setFilter("unknown") }, h("span",{className:"dot unknown"}), "Unconfirmed")
    ),

    h("div", { className:"layout" },
      h("div", { className:"results" },
        loading ? h("div", { className:"status" }, "Looking up parking…") : null,
        error ? h("div", { className:"status error" }, error) : null,
        !loading && !error && results.length === 0 ? h("div", { className:"status" }, "Search an address or tap “Near me” to see nearby parking.") : null,
        !loading && filtered.map(s => h(Ticket, { key: s.id, spot: s }))
      ),
      h("div", { id:"map", ref: mapRef })
    ),

    h("div", { className:"disclaimer" },
      h("strong", null, "Note: "), "Parking data comes from OpenStreetMap's community-maintained map and may be incomplete or outdated. \"Free\" and \"legal\" reflect map tags, not a live legal guarantee — always confirm rules, hours, and fees against posted signage before parking."
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
