function logApiError(context, error){
  console.error("[PeakWatch API]", context, error);
}

async function fetchJsonResilient(url){
  let res;
  try{
    res = await fetch(url);
  }catch(networkErr){
    logApiError("Direct fetch failed: " + url, networkErr);
    // fetch() itself threw — this is the actual CORS/network-failure case, worth a proxy retry
    try{
      const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const res2 = await fetch(proxied);
      if(!res2.ok) throw new Error("HTTP " + res2.status);
      return await res2.json();
    }catch(proxyErr){
      logApiError("Fallback proxy also failed: " + url, proxyErr);
      throw new Error(
        "Couldn't reach the provider directly (likely a network or CORS block: " + networkErr.message + "), " +
        "and the fallback proxy also failed (" + proxyErr.message + ")."
      );
    }
  }
  // We got a real response — CORS isn't the issue. Surface the API's own error, don't waste time on a proxy retry.
  if(!res.ok){
    const body = await res.text().catch(() => "");
    logApiError("Returned HTTP " + res.status + ": " + url, body);
    throw new Error("HTTP " + res.status + (body ? " — " + body.slice(0, 220) : ""));
  }
  return await res.json();
}

// One call gets everything we need: current price, today's change, and the 52-week high —
// Twelve Data's /quote response includes a fifty_two_week.high field directly, so there's no
// need to separately fetch and scan a historical series ourselves.
async function fetchQuoteWithHigh(symbol, apiKey){
  const url = "https://api.twelvedata.com/quote?symbol=" + encodeURIComponent(symbol) + "&apikey=" + encodeURIComponent(apiKey);
  let data;
  try{
    data = await fetchJsonResilient(url);
  }catch(e){
    logApiError("fetchQuoteWithHigh failed for " + symbol, e);
    if(/HTTP 401/.test(e.message) || /apikey/i.test(e.message)){
      throw new Error("This API key isn't valid for Twelve Data — note it needs to be a Twelve Data key (twelvedata.com/pricing), not a key from a different provider. Click \"Change API key\" above to re-enter it.");
    }
    throw e;
  }
  if(data && data.status === "error"){
    throw new Error(data.message || ("Twelve Data returned an error for " + symbol + "."));
  }
  if(!data || data.close === undefined){
    throw new Error("No quote returned for " + symbol + ".");
  }
  const price = parseFloat(data.close);
  const changePct = parseFloat(data.percent_change);
  const athValue = data.fifty_two_week ? parseFloat(data.fifty_two_week.high) : NaN;
  if(isNaN(price) || isNaN(athValue)){
    throw new Error("Couldn't parse price/52-week-high for " + symbol + " from the response.");
  }
  return { price, changePct: isNaN(changePct) ? 0 : changePct, athValue };
}

function IndexRow({ def, state }){
  if(state.loading){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status" }, "Loading…")
    );
  }
  if(state.error){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status error" }, state.error)
    );
  }
  if(!state.quote) return null;

  const { price, changePct, athValue } = state.quote;
  const isUp = changePct >= 0;
  const drawdownPct = ((price - athValue) / athValue) * 100;
  const atPeak = drawdownPct >= -0.05; // essentially at 52-week high
  const fillPct = Math.max(0, Math.min(100, (price / athValue) * 100));

  return h("tr", null,
    h("td", { className: "idx-name" },
      h("div", { className: "serif" }, def.label, " ", h("span", { className: "mono symtag" }, def.symbol)),
      h("div", { className: "idx-sub" }, def.sub)
    ),
    h("td", { className: "num" },
      h("div", { className: "mono price" }, price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
      h("div", { className: "mono change " + (isUp ? "up" : "down") }, (isUp ? "▲ " : "▼ ") + Math.abs(changePct).toFixed(2) + "%")
    ),
    h("td", { className: "num" },
      h("div", { className: "mono" }, athValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
    ),
    h("td", { className: "num" },
      h("div", { className: "mono drawdown " + (atPeak ? "at-peak" : "below-peak") },
        atPeak ? "At peak" : drawdownPct.toFixed(2) + "%"
      ),
      h("div", { className: "gauge" },
        h("div", { className: "gauge-fill", style: { width: fillPct + "%" } }),
        h("div", { className: "gauge-peak-marker" })
      )
    )
  );
}

function StockRow({ def, state, fundamentalsData }){
  const fundamentals = (fundamentalsData || {})[def.symbol];
  if(state.loading){
    return h("tr", null,
      h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
      h("td", { className: "mono" }, def.symbol),
      h("td", { colSpan: 9, className: "idx-status" }, "Loading…")
    );
  }
  if(state.error){
    return h("tr", null,
      h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
      h("td", { className: "mono" }, def.symbol),
      h("td", { colSpan: 9, className: "idx-status error" }, state.error)
    );
  }
  if(!state.quote) return null;

  const { price, athValue } = state.quote;
  const drawdownPct = ((price - athValue) / athValue) * 100;
  const atPeak = drawdownPct >= -0.05;

  return h("tr", null,
    h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
    h("td", { className: "mono" }, def.symbol),
    h("td", { className: "num mono" }, price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
    h("td", { className: "num mono" }, athValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
    h("td", { className: "num" },
      h("div", { className: "mono drawdown " + (atPeak ? "at-peak" : "below-peak") },
        atPeak ? "At peak" : drawdownPct.toFixed(2) + "%"
      )
    ),
    h("td", { className: "num mono" }, fundamentals ? (typeof fundamentals.pe === "number" ? fundamentals.pe.toFixed(1) : fundamentals.pe) : "—"),
    h("td", { className: "num mono" }, fundamentals ? fundamentals.peg : "—"),
    h("td", { className: "num mono" }, fundamentals ? fundamentals.pb : "—"),
    h("td", { className: "num mono" }, fundamentals ? fundamentals.roic : "—"),
    h("td", { className: "mono", style: { whiteSpace: "normal", minWidth: "160px" } }, fundamentals ? fundamentals.fcf : "—"),
    h("td", { style: { whiteSpace: "normal", minWidth: "150px" } }, fundamentals ? fundamentals.earningsGrowth : "—")
  );
}

function App(){
  const [apiKey, setApiKey] = useState("");
  const [keyInput, setKeyInput] = useState("");
  const [data, setData] = useState({}); // key -> { loading, error, quote }
  const [magData, setMagData] = useState({});
  const [semiData, setSemiData] = useState({});
  const [lastRefreshed, setLastRefreshed] = useState(null);
  const [loadingAll, setLoadingAll] = useState(false);
  const [loadProgress, setLoadProgress] = useState(null); // { done, total }

  // Twelve Data's free tier allows only 8 credits/minute, and each quote call costs 1 credit.
  // Firing all symbols in parallel blows straight through that, so we load them one at a
  // time with a comfortable gap instead — slower, but it won't get rate-limited.
  const THROTTLE_MS = 8500;
  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  const loadAll = useCallback(async (key) => {
    setLoadingAll(true);
    const initial = {};
    SYMBOLS.forEach(s => { initial[s.key] = { loading: true, error: null, quote: null }; });
    setData(initial);
    const initialMag = {};
    MAG7.forEach(s => { initialMag[s.key] = { loading: true, error: null, quote: null }; });
    setMagData(initialMag);
    const initialSemi = {};
    SEMI.forEach(s => { initialSemi[s.key] = { loading: true, error: null, quote: null }; });
    setSemiData(initialSemi);

    const tasks = [
      ...SYMBOLS.map(s => ({ kind: "index", def: s })),
      ...MAG7.map(s => ({ kind: "mag", def: s })),
      ...SEMI.map(s => ({ kind: "semi", def: s }))
    ];
    setLoadProgress({ done: 0, total: tasks.length });

    for(let i = 0; i < tasks.length; i++){
      const { kind, def } = tasks[i];
      const setForKind = kind === "index" ? setData : kind === "mag" ? setMagData : setSemiData;
      try{
        const quote = await fetchQuoteWithHigh(def.symbol, key);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: null, quote } }));
      }catch(e){
        logApiError("loadAll: " + kind + " symbol " + def.symbol + " failed", e);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: e.message, quote: null } }));
      }
      setLoadProgress({ done: i + 1, total: tasks.length });
      if(i < tasks.length - 1) await delay(THROTTLE_MS);
    }

    setLastRefreshed(new Date());
    setLoadProgress(null);
    setLoadingAll(false);
  }, []);

  const handleSaveKey = () => {
    const trimmed = keyInput.trim();
    if(!trimmed) return;
    setApiKey(trimmed);
    loadAll(trimmed);
  };

  const handleChangeKey = () => {
    setApiKey("");
    setKeyInput("");
    setData({});
    setMagData({});
  };

  const anyLoaded = Object.values(data).some(d => d && d.quote);

  return h("div", null,
    !apiKey ? h("div", { className: "keybox" },
      h("h2", { className: "serif" }, "Connect a data source"),
      h("p", null, "PeakWatch runs entirely in your browser — it needs your own free Twelve Data API key to fetch live prices. Sign up takes about a minute, no credit card needed for the free tier."),
      h("div", { className: "keyrow" },
        h("input", {
          type: "text", placeholder: "Paste your API key here",
          value: keyInput, onChange: e => setKeyInput(e.target.value)
        }),
        h("button", { className: "btn btn-primary", onClick: handleSaveKey, disabled: !keyInput.trim() }, "Connect")
      ),
      h("p", { className: "note" },
        "Don't have a key? Get one free at ",
        h("a", { href: "https://twelvedata.com/pricing", target: "_blank", rel: "noopener" }, "twelvedata.com"),
        ". Your key is kept in this browser tab's memory only — it's never saved to disk or sent anywhere except directly to Twelve Data, and you'll need to re-enter it next time you open this page."
      )
    ) : h("div", null,
      anyLoaded ? h("div", { className: "ticker" },
        SYMBOLS.map(s => {
          const d = data[s.key];
          if(!d || !d.quote) return null;
          const changePct = d.quote.changePct;
          const up = changePct >= 0;
          return h("div", { className: "chip", key: s.key },
            h("span", { className: "sym" }, s.symbol),
            h("span", null, d.quote.price.toLocaleString(undefined, { maximumFractionDigits: 2 })),
            h("span", { className: up ? "up" : "down" }, (up ? "▲" : "▼") + Math.abs(changePct).toFixed(2) + "%")
          );
        })
      ) : null,

      h("div", { className: "toolbar" },
        h("button", { className: "btn btn-secondary", onClick: () => loadAll(apiKey), disabled: loadingAll },
          loadingAll && loadProgress ? "Loading " + loadProgress.done + " of " + loadProgress.total + "…" : "↻ Refresh"
        ),
        h("button", { className: "btn-text", onClick: handleChangeKey }, "Change API key"),
        lastRefreshed ? h("span", { className: "updated" }, "Last updated ", lastRefreshed.toLocaleTimeString()) : null,
        loadingAll ? h("span", { className: "updated" }, "(throttled to stay under the free-tier rate limit — takes a couple of minutes)") : null
      ),

      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Index"),
              h("th", { className: "num" }, "Price / Today"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "vs. 52-Wk High")
            )
          ),
          h("tbody", null,
            SYMBOLS.map(s => h(IndexRow, { key: s.key, def: s, state: data[s.key] || { loading: true } }))
          )
        )
      ),

      h("h2", { className: "serif section-title" }, "Magnificent 7: Drawdown From 52-Week High"),
      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Company"),
              h("th", null, "Ticker"),
              h("th", { className: "num" }, "Close"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "Drawdown"),
              h("th", { className: "num" }, "P/E"),
              h("th", { className: "num" }, "PEG"),
              h("th", { className: "num" }, "P/B"),
              h("th", { className: "num" }, "ROIC"),
              h("th", null, "Free Cash Flow"),
              h("th", null, "Earnings Growth")
            )
          ),
          h("tbody", null,
            MAG7.map(s => h(StockRow, { key: s.key, def: s, state: magData[s.key] || { loading: true }, fundamentalsData: FUNDAMENTALS.data }))
          )
        )
      ),

      h("div", { className: "mood-box" },
        h("h2", { className: "serif" }, "📐 P/E vs. Each Company's Own History"),
        h("p", { className: "mood-asof" }, "Researched and written by Claude via live web search — as of ", FUNDAMENTALS.asOf, ". A point-in-time snapshot, not a live feed."),
        h("p", { style: { color: "var(--ink-soft)", fontSize: "0.88rem", marginBottom: "16px" } },
          "A high P/E alone doesn't say much — what matters more is how it compares to the company's own typical range. A stock that's dropped can still be expensive if its P/E remains well above its historical norm, and a stock trading at a high absolute P/E can still be reasonably priced if that's actually low for its own history."
        ),
        h("ul", { className: "mood-list" },
          MAG7.map(s => {
            const f = FUNDAMENTALS.data[s.symbol];
            return h("li", { key: s.key },
              h("span", { className: "mood-company" }, s.company, " "),
              h("span", { className: "mood-note" }, f ? f.peHistory : "No data available.")
            );
          })
        )
      ),

      h("div", { className: "mood-box" },
        h("h2", { className: "serif" }, "🗞️ What's Behind the Pullback"),
        h("p", { className: "mood-asof" }, "Researched and written by Claude via live web search — as of ", DRAWDOWN_COMMENTARY.asOf, ". A point-in-time snapshot, not a live feed."),
        h("p", { className: "mood-overall serif" }, DRAWDOWN_COMMENTARY.overall),
        h("ul", { className: "mood-list" },
          MAG7.map(s => h("li", { key: s.key },
            h("span", { className: "mood-company" }, s.company, " "),
            h("span", { className: "mood-note" }, DRAWDOWN_COMMENTARY.notes[s.symbol] || "No commentary available.")
          ))
        )
      ),

      h("h2", { className: "serif section-title" }, "US Semiconductor Stocks: Drawdown From 52-Week High"),
      h("p", { style: { color: "var(--ink-soft)", fontSize: "0.88rem", marginTop: "-8px", marginBottom: "14px" } }, "Nvidia is covered in the Magnificent 7 table above, so it isn't repeated here."),
      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Company"),
              h("th", null, "Ticker"),
              h("th", { className: "num" }, "Close"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "Drawdown"),
              h("th", { className: "num" }, "P/E"),
              h("th", { className: "num" }, "PEG"),
              h("th", { className: "num" }, "P/B"),
              h("th", { className: "num" }, "ROIC"),
              h("th", null, "Free Cash Flow"),
              h("th", null, "Earnings Growth")
            )
          ),
          h("tbody", null,
            SEMI.map(s => h(StockRow, { key: s.key, def: s, state: semiData[s.key] || { loading: true }, fundamentalsData: SEMI_FUNDAMENTALS.data }))
          )
        )
      ),

      h("div", { className: "mood-box" },
        h("h2", { className: "serif" }, "🔬 Contributing Factors & Outlook"),
        h("p", { className: "mood-asof" }, "Researched and written by Claude via live web search — as of ", SEMI_OUTLOOK.asOf, ". A point-in-time snapshot, not a live feed."),
        h("p", { className: "mood-overall serif" }, SEMI_OUTLOOK.overall),
        h("ul", { className: "mood-list" },
          SEMI.map(s => h("li", { key: s.key },
            h("span", { className: "mood-company" }, s.company, " "),
            h("span", { className: "mood-note" }, SEMI_OUTLOOK.notes[s.symbol] || "No commentary available.")
          ))
        )
      )
    ),

    h("div", { className: "disclaimer" },
      h("strong", null, "About this data: "),
      "Prices come from Twelve Data's free tier and may be delayed rather than real-time tick data, and are fetched one symbol at a time with a short pause between each — the free tier allows only 8 requests per minute, and this tool now tracks 17 symbols per refresh (3 indexes, 7 Magnificent 7, 7 semiconductor stocks), so a full load takes a couple of minutes. \"52-Week High\" is Twelve Data's own computed trailing-52-week high for the symbol, returned directly by their quote endpoint. All three indexes are shown via their most widely-tracked ETF (SPY for the S&P 500, QQQ for the Nasdaq 100, URTH for MSCI World) rather than the raw index value — a deliberate choice for consistency and free-tier reliability, since raw index symbols are inconsistently available (or paywalled) across data providers, while these ETFs are freely quotable and track their index closely, if not identically (small tracking difference from fees). P/E, PEG, P/B, ROIC, Free Cash Flow, and Earnings Growth for both the Magnificent 7 and the semiconductor table are a static, dated snapshot researched by Claude via web search — like the outlook commentary boxes, not a live feed. We looked into live options for these specifically (Twelve Data's fundamentals endpoint, SEC EDGAR, Macrotrends, StockAnalysis.com) and none offer free, direct browser access: SEC EDGAR explicitly disables CORS for cross-origin requests, Twelve Data's fundamentals cost more per call than the free tier's entire per-minute budget, and the finance sites only expose data through paid third-party scraping services. Figures are cross-referenced across multiple sources and rounded where possible; where a reliable number genuinely couldn't be found, that's marked \"est.\" or described qualitatively rather than invented (\"n/m\" = not meaningful, shown for Tesla's PEG since shrinking earnings break the calculation). Microsoft and Meta report their latest quarter on Jul 29, and Apple and Amazon on Jul 30 — as of the Mag 7 snapshot's research date, those four show \"Reports [date]\" rather than an actual figure. Intel's P/E and PEG are flagged as dated (April 2026), since they predate the large first-half rally described in the outlook note below — a case where the number and the narrative diverge, worth reading together rather than at face value alone. None of this updates automatically and none of it should be read as current data or investment advice."
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
