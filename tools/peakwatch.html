<style>
  :root{
    --paper:#FFF1E5;
    --paper-2:#F7E1CC;
    --card:#FFFAF4;
    --ink:#0D1B2A;
    --ink-soft:#5c5346;
    --navy:#16324F;
    --navy-2:#0E2338;
    --gold:#A9803F;
    --gain:#1F7A4D;
    --loss:#B23A2E;
    --line:#E6CDAE;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif;
    line-height:1.55;
  }
  .serif{font-family:'Newsreader',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1440px;margin:0 auto;padding:0 clamp(16px,3vw,40px);}

  .topbar{padding:16px 0;}
  .backlink{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    color:var(--navy);font-weight:600;font-size:0.85rem;
  }

  .masthead{
    border-top:3px solid var(--ink);
    border-bottom:3px solid var(--ink);
    padding:22px 0 16px;
    margin-bottom:6px;
  }
  .masthead h1{
    font-size:clamp(2rem,5vw,3.2rem);
    margin:0;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .masthead .tagline{
    text-align:center;
    font-style:italic;
    color:var(--ink-soft);
    margin:6px 0 0;
    font-size:clamp(0.9rem,1.2vw,1.02rem);
  }
  .dateline{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding:8px 0 10px;margin-bottom:24px;
    text-transform:uppercase;letter-spacing:0.04em;
  }

  /* API key setup */
  .keybox{
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:26px;
  }
  .keybox h2{font-size:1.15rem;margin:0 0 6px;}
  .keybox p{color:var(--ink-soft);font-size:0.9rem;margin:0 0 14px;}
  .keyrow{display:flex;flex-wrap:wrap;gap:10px;}
  .keyrow input{
    flex:1 1 260px;padding:11px 13px;border-radius:9px;border:2px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:0.9rem;background:#fff;color:var(--ink);
  }
  button.btn{
    font-family:'Public Sans',sans-serif;font-weight:700;border:none;border-radius:9px;
    padding:11px 20px;cursor:pointer;font-size:0.92rem;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-primary:disabled{background:#a9a49b;cursor:not-allowed;}
  .btn-secondary{background:#fff;border:2px solid var(--line);color:var(--ink);}
  .btn-secondary:hover{border-color:var(--navy);}
  .btn-text{background:none;border:none;color:var(--navy);font-weight:600;text-decoration:underline;cursor:pointer;padding:0;}
  .btn-text:hover{color:var(--navy-2);}
  .keybox .note{font-size:0.78rem;color:var(--ink-soft);margin-top:10px;}
  .keybox a{color:var(--navy);}

  /* ticker strip */
  .ticker{
    display:flex;gap:14px;flex-wrap:wrap;
    padding:12px 16px;background:var(--navy);border-radius:10px;margin-bottom:26px;
  }
  .ticker .chip{
    color:#fff;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;
    display:flex;gap:8px;align-items:baseline;
  }
  .ticker .chip .sym{font-weight:700;color:#F7E1CC;}
  .ticker .chip .up{color:#7CD3A0;}
  .ticker .chip .down{color:#F0958A;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .toolbar .updated{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink-soft);}

  /* index table */
  .table-wrap{
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    overflow-x:auto;margin-bottom:30px;
  }
  table.idx-table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  .idx-table thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:0.65rem;
    text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);
    padding:12px 10px;border-bottom:2px solid var(--ink);
  }
  .idx-table thead th.num{text-align:right;}
  .idx-table tbody tr{border-bottom:1px solid var(--line);}
  .idx-table tbody tr:last-child{border-bottom:none;}
  .idx-table td{padding:11px 10px;vertical-align:top;}
  .idx-table td.num{text-align:right;}

  .idx-name .serif{font-size:1rem;}
  .idx-sub{font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
  .symtag{font-size:0.66rem;color:var(--ink-soft);font-weight:400;}

  .price{font-size:1.15rem;font-weight:700;}
  .change{font-size:0.85rem;font-weight:600;margin-top:2px;}
  .change.up{color:var(--gain);}
  .change.down{color:var(--loss);}

  .gauge{
    position:relative;height:8px;width:120px;border-radius:999px;background:var(--paper-2);
    margin-top:6px;overflow:hidden;border:1px solid var(--line);margin-left:auto;
  }
  .gauge-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--navy));
  }
  .gauge-peak-marker{
    position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:var(--ink);
  }
  .drawdown{font-size:1rem;font-weight:700;}
  .drawdown.at-peak{color:var(--gain);}
  .drawdown.below-peak{color:var(--loss);}

  .idx-status{font-size:0.85rem;color:var(--ink-soft);padding:16px;}
  .idx-status.error{color:var(--loss);}

  .coverage-cell{max-width:180px;}
  .coverage-note{font-size:0.7rem;color:var(--ink-soft);font-style:italic;}

  .section-title{font-size:1.4rem;margin:8px 0 14px;}

  .mood-box{
    background:var(--navy);color:#fff;border-radius:var(--radius);
    padding:22px 24px;margin-bottom:30px;
  }
  .mood-box h2{color:#fff;font-size:1.35rem;margin:0 0 6px;}
  .mood-asof{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:#C9B896;margin:0 0 14px;}
  .mood-overall{font-style:italic;font-size:1.1rem;color:#F7E1CC;margin:0 0 16px;line-height:1.5;}
  .mood-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
  .mood-list li{border-top:1px solid rgba(255,255,255,0.15);padding-top:12px;}
  .mood-company{font-family:'Newsreader',serif;font-weight:600;color:#fff;}
  .mood-note{color:#E4D8C7;font-size:0.92rem;}

  .disclaimer{
    font-size:0.78rem;color:var(--ink-soft);line-height:1.6;
    border-top:1px solid var(--line);padding:20px 0 40px;
    max-width:90ch;
  }
  .disclaimer strong{color:var(--ink);}
  .status-load-error{color:var(--loss);font-weight:600;padding:16px 0;}

  /* research cards (shared by all three tables) */
  .research-cards{margin-bottom:34px;}
  .research-cards .mood-box{margin-bottom:16px;}
  .mood-box .btn-text{color:#F7E1CC;}
  .mood-box .btn-text:disabled{opacity:0.6;cursor:default;}
  .mood-group{display:inline-block;margin-left:10px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#C9B896;vertical-align:middle;}
  .mood-intro{color:#E4D8C7;font-size:0.86rem;margin:0 0 16px;}
  .mood-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:3px;}
  .mood-sym{font-size:0.7rem;color:#C9B896;}
  .mood-chip{font-size:0.7rem;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,0.1);color:#F7E1CC;white-space:nowrap;}
  .mood-chip.up{color:#7CD3A0;}
  .mood-chip.down{color:#F0958A;}
  .mood-tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;padding:1px 6px;border-radius:4px;border:1px solid rgba(247,225,204,0.45);color:#F7E1CC;}
  .mood-eg{margin-top:6px;font-size:0.84rem;color:#E4D8C7;padding-left:10px;border-left:2px solid var(--gold);}
  .mood-eg-label{display:block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;color:#C9B896;}
  .mood-status{margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:0.82rem;background:rgba(255,255,255,0.08);color:#F7E1CC;}
  .mood-status.error{background:rgba(178,58,46,0.35);color:#fff;}
  .mood-sources{margin-top:16px;border-top:1px solid rgba(255,255,255,0.15);padding-top:10px;font-size:0.8rem;}
  .mood-sources summary{cursor:pointer;color:#C9B896;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;}
  .mood-sources ul{margin:8px 0 0;padding-left:18px;}
  .mood-sources a{color:#F7E1CC;word-break:break-word;}
  .subnum{white-space:nowrap;font-size:0.7rem;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  @media (max-width:600px){
    .mood-box{padding:18px 16px;}
    .mood-group{display:block;margin:4px 0 0;}
  }
</style>
</head>

<script>
// The research module (peakwatch.research.js, unit-tested in tools/tests/) is loaded with a fresh
// ?v=<timestamp> on every page load so a cached copy is never used after a deploy (GitHub Pages
// can't be told not to cache). The app starts only once it has loaded.
(function loadResearchModule(){
  var s = document.createElement("script");
  s.src = "peakwatch.research.js?v=" + Date.now().toString(36);
  s.onload = startPeakWatch;
  s.onerror = function(){
    var root = document.getElementById("root");
    root.textContent = "PeakWatch couldn't load its research module (peakwatch.research.js). Check your connection and reload the page.";
    root.className = "status-load-error";
  };
  document.head.appendChild(s);
})();

function startPeakWatch(){
const { useState, useCallback, useEffect, useRef } = React;
const PW = window.PeakWatchResearch;
const h = React.createElement;

const SYMBOLS = [

const WATCHLIST = [

// ---------------------------------------------------------------------------------------------
const GROUPS = [
  { id: "mag7", title: "Magnificent 7", promptLabel: "Magnificent 7 mega-cap tech stocks", companies: MAG7 },
  { id: "semi", title: "US Semiconductors", promptLabel: "US-listed semiconductor stocks (Nvidia excluded — covered in the Magnificent 7 group)", companies: SEMI },

//  - "Own history" P/E ranges are Claude's approximate recall of multi-year ranges, NOT a
//    sourced 5-year average — they're flagged "approx." in the text. Verify before relying on them.
//  - Pullback/outlook notes cite specific, dated events (Fed hike Sep 16, AI-lab CEO essays
//    Sep 14, post-earnings moves). Nothing here is investment advice.
const RESEARCH_SNAPSHOT = {
  asOf: "September 21, 2026",

      outlookOverall: "Earnings are strong almost across the board, and CNBC reported in early August that a Magnificent 7 ETF had fallen to a record-low valuation. The next leg depends less on growth than on rates and on proof that record AI capex earns its keep.",

          peHistory: "At ~38.6x trailing (~36.5x forward) Apple sits above the high-20s-to-low-30s range it held for most of the past five years (approx.) — the ~41% 52-week run has outpaced even a +29% EPS quarter, so the multiple has expanded.",
          pullbackNote: "Barely a pullback — trading within a few percent of its ~$344 all-time high as the iPhone 18 launch is tracked for demand signals; one of the few mega-caps holding up through the rate-hike and AI-sentiment selloff.",

          earningsGrowth: "Q2 2026: revenue $60.8B, +28% YoY (beat); EPS $6.18, –14% YoY vs ~$7.17 est., hit by $2.4B legal and $1.2B severance charges. Q2 free cash flow just $0.8B as capex reached $31.1B.",

function logApiError(context, error){
  console.error("[PeakWatch API]", context, error);
}

// Direct call to Twelve Data only. The old fallback re-sent the request (API key included, in the
// URL) through a public third-party proxy whenever the direct call failed — removed: a key must
// only ever travel to its own provider. The Content-Security-Policy above enforces the same rule.
async function fetchQuoteWithHigh(symbol, apiKey){
  try{
    return await PW.fetchQuoteWithHigh(symbol, apiKey);
  }catch(e){
    logApiError("fetchQuoteWithHigh failed for " + symbol, e);
    throw e;
  }
}

function IndexRow({ def, state }){
  if(state.loading){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status" }, "Loading…")
    );
  }
  if(state.error){
    return h("tr", null,
      h("td", { className: "idx-name" },
        h("div", { className: "serif" }, def.label),
        h("div", { className: "idx-sub" }, def.sub)
      ),
      h("td", { colSpan: 3, className: "idx-status error" }, state.error)
    );
  }
  if(!state.quote) return null;

  const { price, changePct, athValue } = state.quote;
  const isUp = changePct >= 0;
  const drawdownPct = ((price - athValue) / athValue) * 100;
  const atPeak = drawdownPct >= -0.05; // essentially at 52-week high
  const fillPct = Math.max(0, Math.min(100, (price / athValue) * 100));

  return h("tr", null,
    h("td", { className: "idx-name" },
      h("div", { className: "serif" }, def.label, " ", h("span", { className: "mono symtag" }, def.symbol)),
      h("div", { className: "idx-sub" }, def.sub)
    ),
    h("td", { className: "num" },
      h("div", { className: "mono price" }, price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
      h("div", { className: "mono change " + (isUp ? "up" : "down") }, (isUp ? "▲ " : "▼ ") + Math.abs(changePct).toFixed(2) + "%")
    ),
    h("td", { className: "num" },
      h("div", { className: "mono" }, athValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
    ),
    h("td", { className: "num" },
      h("div", { className: "mono drawdown " + (atPeak ? "at-peak" : "below-peak") },
        atPeak ? "At peak" : drawdownPct.toFixed(2) + "%"
      ),
      h("div", { className: "gauge" },
        h("div", { className: "gauge-fill", style: { width: fillPct + "%" } }),
        h("div", { className: "gauge-peak-marker" })
      )
    )
  );
}

function StockRow({ def, state, fundamentalsData }){
  const fundamentals = (fundamentalsData || {})[def.symbol];
  if(state.loading){
    return h("tr", null,
      h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
      h("td", { className: "mono" }, def.symbol),
      h("td", { colSpan: 9, className: "idx-status" }, "Loading…")
    );
  }
  if(state.error){
    return h("tr", null,
      h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
      h("td", { className: "mono" }, def.symbol),
      h("td", { colSpan: 9, className: "idx-status error" }, state.error)
    );
  }
  if(!state.quote) return null;

  const { price, athValue } = state.quote;
  const drawdownPct = ((price - athValue) / athValue) * 100;
  const atPeak = drawdownPct >= -0.05;

  return h("tr", null,
    h("td", { className: "idx-name" }, h("div", { className: "serif" }, def.company)),
    h("td", { className: "mono" }, def.symbol),
    h("td", { className: "num mono" }, price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
    h("td", { className: "num mono" }, athValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
    h("td", { className: "num" },
      h("div", { className: "mono drawdown " + (atPeak ? "at-peak" : "below-peak") },
        atPeak ? "At peak" : drawdownPct.toFixed(2) + "%"
      )
    ),
    h("td", { className: "num mono" },
      fundamentals ? (PW.formatPe(fundamentals.pe) || "—") : "—",
      fundamentals && fundamentals.fwdPe !== null && fundamentals.fwdPe !== undefined ? h("div", { className: "subnum" }, "fwd " + PW.formatPe(fundamentals.fwdPe)) : null
    ),
    h("td", { className: "num mono" }, fundamentals ? fundamentals.peg : "—"),
    h("td", { className: "num mono" }, fundamentals ? fundamentals.pb : "—"),

  );

/* ---------- Live research via Gemini (BYOK, Google Search grounding) ----------
   All research logic lives in peakwatch.research.js (unit-tested). This page only renders it.
   Quota: 1 combined call for all three tables; only tables that come back incomplete are
   retried (worst case 1 + 3 calls). Key, rate-limit and network errors are never retried. */

const researcher = PW.createResearcher({ log: logApiError });

/* ---------- The three research cards rendered under every stock table ---------- */
function ResearchCards({ group, research, status, quoteState, onRefresh }){
  const refreshing = !!(status && status.refreshing);
  const error = status && status.error;
  const notice = status && status.notice;
  const isLive = research.source === "live";

  const asOfLine = () => h("p", { className: "mood-asof" },
    isLive ? "Live research (Gemini + Google Search) as of " + research.asOf : "Dated snapshot researched " + research.asOf + (research.metricsAsOf ? " · metrics at " + research.metricsAsOf : ""),
    ". ",
    h("button", { className: "btn-text", onClick: onRefresh, disabled: refreshing }, refreshing ? "Refreshing…" : "🔄 Refresh Research")
  );

  const staleTag = (entry) => (isLive && entry && !entry.live)
    ? h("span", { className: "mood-tag", title: "Not returned by the latest live refresh — still showing the dated snapshot." }, "snapshot")
    : null;

  const head = (c, chips) => h("div", { className: "mood-head" },
    h("span", { className: "mood-company" }, c.company),
    h("span", { className: "mood-sym mono" }, c.symbol),
    chips,
    staleTag(research.companies[c.symbol])
  );
  const missing = "No assessment yet — click Refresh Research.";

  return h("div", { className: "research-cards" },
    h("div", { className: "mood-box" },
      h("h2", { className: "serif" }, "📐 P/E vs. Each Company's Own History", h("span", { className: "mood-group" }, group.title)),
      asOfLine(),
      error ? h("div", { className: "mood-status error", role: "alert" }, error) : null,
      notice ? h("div", { className: "mood-status" }, notice) : null,
      h("p", { className: "mood-intro" },
        "A high P/E alone says little — what matters is how it compares with the company's own typical range. A stock that has dropped can still be expensive against its history, and a high absolute P/E can be cheap for that company. Snapshot ranges marked \"approx.\" are estimates to verify, not a sourced 5-year average."
      ),
      h("ul", { className: "mood-list" },
        group.companies.map(c => {
          const f = research.companies[c.symbol] || {};
          const pe = PW.formatPe(f.pe), fwd = PW.formatPe(f.fwdPe);
          const chips = (pe || fwd) ? h("span", { className: "mood-chip mono" }, (pe ? "P/E " + pe : "") + (pe && fwd ? " · " : "") + (fwd ? "fwd " + fwd : "")) : null;
          return h("li", { key: c.key }, head(c, chips), h("span", { className: "mood-note" }, f.peHistory || missing));
        })
      )
    ),

    h("div", { className: "mood-box" },
      h("h2", { className: "serif" }, "🗞️ What's Behind the Pullback", h("span", { className: "mood-group" }, group.title)),
      asOfLine(),
      research.pullbackOverall ? h("p", { className: "mood-overall serif" }, research.pullbackOverall) : null,
      h("ul", { className: "mood-list" },
        group.companies.map(c => {
          const f = research.companies[c.symbol] || {};
          const dd = PW.drawdownFor(quoteState[c.key]);
          const chips = dd === null ? null : h("span", { className: "mood-chip mono " + (dd >= -0.05 ? "up" : "down"), title: "Live: price vs. Twelve Data's trailing 52-week high" }, dd >= -0.05 ? "at 52-wk high" : dd.toFixed(1) + "% vs 52-wk high");
          return h("li", { key: c.key }, head(c, chips), h("span", { className: "mood-note" }, f.pullbackNote || missing));
        })
      )
    ),

    h("div", { className: "mood-box" },
      h("h2", { className: "serif" }, "🔬 Contributing Factors & Outlook", h("span", { className: "mood-group" }, group.title)),
      asOfLine(),
      research.outlookOverall ? h("p", { className: "mood-overall serif" }, research.outlookOverall) : null,
      h("ul", { className: "mood-list" },
        group.companies.map(c => {
          const f = research.companies[c.symbol] || {};
          return h("li", { key: c.key },
            head(c, null),
            h("span", { className: "mood-note" }, f.outlookNote || missing),
            f.earningsGrowth ? h("div", { className: "mood-eg" }, h("span", { className: "mood-eg-label mono" }, "Latest earnings"), f.earningsGrowth) : null
          );
        })
      ),
      research.sources && research.sources.length ? h("details", { className: "mood-sources" },
        h("summary", null, "Sources Gemini cited (" + research.sources.length + ")" + (research.model ? " · " + research.model : "")),
        h("ul", null, research.sources.map((s, i) => h("li", { key: i }, h("a", { href: s.uri, target: "_blank", rel: "noopener noreferrer nofollow" }, s.title))))
      ) : null
    )
  );
}

  const [apiKey, setApiKey] = useState("");
  const [keyInput, setKeyInput] = useState("");
  const [data, setData] = useState({}); // key -> { loading, error, quote }
  const [magData, setMagData] = useState({});
  const [semiData, setSemiData] = useState({});
  const [watchlistData, setWatchlistData] = useState({});
  const [lastRefreshed, setLastRefreshed] = useState(null);
  const [loadingAll, setLoadingAll] = useState(false);
  const [loadProgress, setLoadProgress] = useState(null); // { done, total }

  // Research starts from the dated snapshot and is replaced table-by-table with live Gemini
  // research — automatically when a Gemini key is connected, and again on every main Refresh.
  const [research, setResearch] = useState(() => {
    const init = {};
    GROUPS.forEach(g => { init[g.id] = PW.snapshotGroupState(RESEARCH_SNAPSHOT, g.id); });
    return init;
  });
  const [researchStatus, setResearchStatus] = useState({}); // groupId -> { refreshing, error, notice }
  const [geminiKey, setGeminiKey] = useState("");
  const [geminiKeyInput, setGeminiKeyInput] = useState("");
  const researchInFlight = useRef(false);

  const handleSaveGeminiKey = () => {
    const trimmed = geminiKeyInput.trim();
    if(!trimmed) return;
    setGeminiKey(trimmed);
  };

  const setStatusFor = (ids, patch) => setResearchStatus(prev => {
    const next = Object.assign({}, prev);
    ids.forEach(id => { next[id] = Object.assign({}, prev[id], patch); });
    return next;
  });

  const refreshAllResearch = async () => {
    const allIds = GROUPS.map(g => g.id);
    if(!geminiKey){
      setStatusFor(allIds, { refreshing: false, error: "Connect a Gemini API key above first.", notice: null });
      return;
    }
    if(researchInFlight.current) return; // guards the auto-refresh effect racing a button click
    researchInFlight.current = true;
    setStatusFor(allIds, { refreshing: true, error: null, notice: null });
    try{
      await PW.runResearchRefresh({
        apiKey: geminiKey,
        groups: GROUPS,
        researchGroups: researcher.researchGroups,
        onGroupResult: (group, groupResult, meta) => setResearch(prev => Object.assign({}, prev, { [group.id]: PW.mergeLiveGroup(prev[group.id], group, groupResult, meta) })),
        onGroupStatus: setStatusFor
      });
    }catch(e){
      logApiError("Research refresh failed unexpectedly", e);
      setStatusFor(allIds, { refreshing: false, error: "Research refresh failed unexpectedly (" + e.message + ").", notice: null });
    }finally{
      researchInFlight.current = false;
    }
  };

  // Auto-fetch fresh research the moment a Gemini key is connected. Runs once per key.
  useEffect(() => {
    if(geminiKey){
      refreshAllResearch();
    }
  }, [geminiKey]);

  // Twelve Data's free tier allows only 8 credits/minute, and each quote call costs 1 credit.
  // Firing all symbols in parallel blows straight through that, so we load them one at a
  // time with a comfortable gap instead — slower, but it won't get rate-limited.
  const THROTTLE_MS = 8500;
  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  const loadAll = useCallback(async (key) => {
    setLoadingAll(true);
    const initial = {};
    SYMBOLS.forEach(s => { initial[s.key] = { loading: true, error: null, quote: null }; });
    setData(initial);
    const initialMag = {};
    MAG7.forEach(s => { initialMag[s.key] = { loading: true, error: null, quote: null }; });
    setMagData(initialMag);
    const initialSemi = {};
    SEMI.forEach(s => { initialSemi[s.key] = { loading: true, error: null, quote: null }; });
    setSemiData(initialSemi);
    const initialWatchlist = {};
    WATCHLIST.forEach(s => { initialWatchlist[s.key] = { loading: true, error: null, quote: null }; });
    setWatchlistData(initialWatchlist);

    const tasks = [
      ...SYMBOLS.map(s => ({ kind: "index", def: s })),
      ...MAG7.map(s => ({ kind: "mag", def: s })),
      ...SEMI.map(s => ({ kind: "semi", def: s })),
      ...WATCHLIST.map(s => ({ kind: "watchlist", def: s }))
    ];
    setLoadProgress({ done: 0, total: tasks.length });

    for(let i = 0; i < tasks.length; i++){
      const { kind, def } = tasks[i];
      const setForKind = kind === "index" ? setData : kind === "mag" ? setMagData : kind === "semi" ? setSemiData : setWatchlistData;
      try{
        const quote = await fetchQuoteWithHigh(def.symbol, key);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: null, quote } }));
      }catch(e){
        logApiError("loadAll: " + kind + " symbol " + def.symbol + " failed", e);
        setForKind(prev => ({ ...prev, [def.key]: { loading: false, error: e.message, quote: null } }));
      }
      setLoadProgress({ done: i + 1, total: tasks.length });
      if(i < tasks.length - 1) await delay(THROTTLE_MS);
    }

    setLastRefreshed(new Date());
    setLoadProgress(null);
    setLoadingAll(false);
  }, []);

  const handleSaveKey = () => {
    const trimmed = keyInput.trim();
    if(!trimmed) return;
    setApiKey(trimmed);
    loadAll(trimmed);
  };

  const handleChangeKey = () => {
    setApiKey("");
    setKeyInput("");
    setData({});
    setMagData({});
    setSemiData({});
    setWatchlistData({});
  };

  const anyLoaded = Object.values(data).some(d => d && d.quote);

  return h("div", null,
    !apiKey ? h("div", { className: "keybox" },
      h("h2", { className: "serif" }, "Connect a data source"),
      h("p", null, "PeakWatch runs entirely in your browser — it needs your own free Twelve Data API key to fetch live prices. Sign up takes about a minute, no credit card needed for the free tier."),
      h("div", { className: "keyrow" },
        h("input", {
          type: "text", placeholder: "Paste your API key here",
          value: keyInput, onChange: e => setKeyInput(e.target.value)
        }),
        h("button", { className: "btn btn-primary", onClick: handleSaveKey, disabled: !keyInput.trim() }, "Connect")
      ),
      h("p", { className: "note" },
        "Don't have a key? Get one free at ",
        h("a", { href: "https://twelvedata.com/pricing", target: "_blank", rel: "noopener" }, "twelvedata.com"),
        ". Your key is kept in this browser tab's memory only — it's never saved to disk or sent anywhere except directly to Twelve Data (there is no proxy fallback, and the page's security policy blocks requests to any other host), and you'll need to re-enter it next time you open this page."
      )
    ) : h("div", null,
      anyLoaded ? h("div", { className: "ticker" },
        SYMBOLS.map(s => {
          const d = data[s.key];
          if(!d || !d.quote) return null;
          const changePct = d.quote.changePct;
          const up = changePct >= 0;
          return h("div", { className: "chip", key: s.key },
            h("span", { className: "sym" }, s.symbol),
            h("span", null, d.quote.price.toLocaleString(undefined, { maximumFractionDigits: 2 })),
            h("span", { className: up ? "up" : "down" }, (up ? "▲" : "▼") + Math.abs(changePct).toFixed(2) + "%")
          );
        })
      ) : null,

      h("div", { className: "toolbar" },
        h("button", {
          className: "btn btn-secondary",
          onClick: () => {
            loadAll(apiKey);
            // Tie research refresh to the main price refresh, but only if a Gemini key is already
            // connected — this keeps data fresh without ever spending API quota you haven't opted into.
            if(geminiKey){
              refreshAllResearch();
            }
          },
          disabled: loadingAll
        },
          loadingAll && loadProgress ? "Loading " + loadProgress.done + " of " + loadProgress.total + "…" : "↻ Refresh"
        ),
        h("button", { className: "btn-text", onClick: handleChangeKey }, "Change API key"),
        lastRefreshed ? h("span", { className: "updated" }, "Last updated ", lastRefreshed.toLocaleTimeString()) : null,
        loadingAll ? h("span", { className: "updated" }, "(throttled to stay under the free-tier rate limit — takes a few minutes for 25 symbols)") : null,
        geminiKey ? h("span", { className: "updated" }, "(Refresh also updates research, since Gemini is connected)") : null
      ),

      !geminiKey ? h("div", { className: "keybox" },
        h("h2", { className: "serif", style: { fontSize: "1.1rem" } }, "Connect Gemini for live research"),
        h("p", { style: { fontSize: "0.85rem" } }, "The valuation columns, Earnings Growth, and the three research cards under every table (P/E vs. own history, What's Behind the Pullback, Contributing Factors & Outlook) start from a dated snapshot. Connecting a free Gemini API key from ", h("a", { href: "https://aistudio.google.com/apikey", target: "_blank", rel: "noopener noreferrer" }, "aistudio.google.com"), " immediately pulls fresh, search-grounded research for all three tables, then does the same each time you click the main Refresh button above."),
        h("div", { className: "keyrow" },
          h("input", { type: "text", placeholder: "Paste your Gemini API key here", value: geminiKeyInput, onChange: e => setGeminiKeyInput(e.target.value) }),
          h("button", { className: "btn btn-primary", onClick: handleSaveGeminiKey, disabled: !geminiKeyInput.trim() }, "Connect")
        ),
        h("p", { className: "note" }, "Kept in this tab's memory only, same as your Twelve Data key — never saved to disk, and only ever sent to Google (in a request header, not the URL). Each refresh uses 1 Gemini call for all three tables; only if that response comes back truncated or incomplete does it retry the affected tables (up to 3 more calls). Rate-limit and key errors are never retried.")
      ) : null,

      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Index"),
              h("th", { className: "num" }, "Price / Today"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "vs. 52-Wk High")
            )
          ),
          h("tbody", null,
            SYMBOLS.map(s => h(IndexRow, { key: s.key, def: s, state: data[s.key] || { loading: true } }))
          )
        )
      ),

      h("h2", { className: "serif section-title" }, "Magnificent 7: Drawdown From 52-Week High"),
      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Company"),
              h("th", null, "Ticker"),
              h("th", { className: "num" }, "Close"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "Drawdown"),
              h("th", { className: "num" }, "P/E"),
              h("th", { className: "num" }, "PEG"),
              h("th", { className: "num" }, "P/B"),
              h("th", { className: "num" }, "ROIC"),
              h("th", null, "Free Cash Flow"),
              h("th", null, "Earnings Growth")
            )
          ),
          h("tbody", null,
            MAG7.map(s => h(StockRow, { key: s.key, def: s, state: magData[s.key] || { loading: true }, fundamentalsData: research.mag7.companies }))
          )
        )
      ),

      h(ResearchCards, { group: GROUPS[0], research: research.mag7, status: researchStatus.mag7, quoteState: magData, onRefresh: refreshAllResearch }),

      h("h2", { className: "serif section-title" }, "US Semiconductor Stocks: Drawdown From 52-Week High"),
      h("p", { style: { color: "var(--ink-soft)", fontSize: "0.88rem", marginTop: "-8px", marginBottom: "14px" } }, "Nvidia is covered in the Magnificent 7 table above, so it isn't repeated here."),
      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Company"),
              h("th", null, "Ticker"),
              h("th", { className: "num" }, "Close"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "Drawdown"),
              h("th", { className: "num" }, "P/E"),
              h("th", { className: "num" }, "PEG"),
              h("th", { className: "num" }, "P/B"),
              h("th", { className: "num" }, "ROIC"),
              h("th", null, "Free Cash Flow"),
              h("th", null, "Earnings Growth")
            )
          ),
          h("tbody", null,
            SEMI.map(s => h(StockRow, { key: s.key, def: s, state: semiData[s.key] || { loading: true }, fundamentalsData: research.semi.companies }))
          )
        )
      ),

      h(ResearchCards, { group: GROUPS[1], research: research.semi, status: researchStatus.semi, quoteState: semiData, onRefresh: refreshAllResearch }),

      h("h2", { className: "serif section-title" }, "Tech & Supply Chain Watchlist: Drawdown From 52-Week High"),
      h("p", { style: { color: "var(--ink-soft)", fontSize: "0.88rem", marginTop: "-8px", marginBottom: "14px" } }, "Enterprise tech (Oracle, Dell), Korean memory exposure (SK hynix, and the broader South Korea market via EWY), and chip equipment / photonics (Arm, ASML, KLA, Lumentum)."),
      h("div", { className: "table-wrap" },
        h("table", { className: "idx-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "Company"),
              h("th", null, "Ticker"),
              h("th", { className: "num" }, "Close"),
              h("th", { className: "num" }, "52-Week High"),
              h("th", { className: "num" }, "Drawdown"),
              h("th", { className: "num" }, "P/E"),
              h("th", { className: "num" }, "PEG"),
              h("th", { className: "num" }, "P/B"),
              h("th", { className: "num" }, "ROIC"),
              h("th", null, "Free Cash Flow"),
              h("th", null, "Earnings Growth")
            )
          ),
          h("tbody", null,
            WATCHLIST.map(s => h(StockRow, { key: s.key, def: s, state: watchlistData[s.key] || { loading: true }, fundamentalsData: research.watchlist.companies }))
          )
        )
      ),

      h(ResearchCards, { group: GROUPS[2], research: research.watchlist, status: researchStatus.watchlist, quoteState: watchlistData, onRefresh: refreshAllResearch })
    ),

    h("div", { className: "disclaimer" },
      h("strong", null, "About this data: "),
      "Prices come from Twelve Data's free tier and may be delayed rather than real-time tick data, and are fetched one symbol at a time with a short pause between each — the free tier allows only 8 requests per minute, and this tool now tracks 25 symbols per refresh (3 indexes, 7 Magnificent 7, 7 semiconductor stocks, 8 in the tech/supply-chain watchlist), so a full load takes a few minutes. \"52-Week High\" is Twelve Data's own computed trailing-52-week high for the symbol, returned directly by their quote endpoint. All three indexes are shown via their most widely-tracked ETF (SPY for the S&P 500, QQQ for the Nasdaq 100, URTH for MSCI World) rather than the raw index value — a deliberate choice for consistency and free-tier reliability, since raw index symbols are inconsistently available (or paywalled) across data providers, while these ETFs are freely quotable and track their index closely, if not identically (small tracking difference from fees). P/E (trailing and forward), PEG, P/B, ROIC, Free Cash Flow, Earnings Growth, and the three research cards under every table (P/E vs. own history, What's Behind the Pullback, Contributing Factors & Outlook) are pulled live via Gemini (your own free API key) using Google Search grounding — automatically once you connect a key, and again on each main Refresh. Sources Gemini cited are listed under each table. Before connecting a key they show a dated snapshot researched by Claude on September 21–22, 2026 (metrics from stockanalysis.com at the Sep 18 close; earnings from company releases); its 'own history' P/E ranges are approximate and marked as such. Rows a live refresh didn't return keep their snapshot values and are tagged 'snapshot'. Both API keys go only to their own provider: there is no third-party proxy fallback, and a Content-Security-Policy blocks requests to any other host. We looked into fully live options first (Twelve Data's fundamentals endpoint, SEC EDGAR, Macrotrends, StockAnalysis.com) and none offer free, direct browser access: SEC EDGAR explicitly disables CORS for cross-origin requests, Twelve Data's fundamentals cost more per call than the free tier's entire per-minute budget, and the finance sites only expose data through paid third-party scraping services. Whether from the fallback snapshot or a live Gemini refresh, figures can vary by source (trailing vs. forward P/E, differing growth-rate assumptions for PEG) and are approximate rather than exact (\"n/m\" = not meaningful, e.g. for a company with shrinking earnings that breaks the PEG calculation). None of this is investment advice, and any AI-researched figure should be treated as a starting point to verify, not a guaranteed-current data feed."
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
} // end startPeakWatch
</script>
</body>
</html>
